  - category: required
    path: expected.mainLandmarks
    name: missing expected landmark count
    find: "    expected:\n      mainLandmarks: 0\n      tabPanelLabel: full trace\n  - name: alternate_session_and_checked_checkbox\n"
    replace: "    expected:\n      tabPanelLabel: full trace\n  - name: alternate_session_and_checked_checkbox\n"
