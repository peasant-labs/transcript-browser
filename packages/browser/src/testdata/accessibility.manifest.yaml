expectedCaseCount: 3
requiredCaseNames:
  - mounted_transcript_and_checkbox
  - alternate_session_and_checked_checkbox
  - nullable_turns_empty_session
expectedRequiredFieldMutationCount: 33
requiredFieldPaths:
  - root.expectedCaseCount
  - root.cases
  - case.name
  - case.session
  - case.checkbox
  - case.expected
  - session.id
  - session.harness
  - session.startTime
  - session.endTime
  - session.durationMins
  - session.totalTokens
  - session.tokensIn
  - session.tokensOut
  - session.turnCount
  - session.toolCallCount
  - session.workingDirectory
  - session.gitBranch
  - session.gitRemote
  - session.scorecard
  - session.turns
  - turn.index
  - turn.role
  - turn.content
  - turn.timestamp
  - turn.depth
  - turn.stopReason
  - checkbox.label
  - checkbox.count
  - checkbox.initialChecked
  - checkbox.expectedAfterClick
  - expected.mainLandmarks
  - expected.tabPanelLabel
expectedStructuralMutationCount: 5
expectedLoaderMutationCount: 38
loaderMutations:
  - category: required
    path: root.expectedCaseCount
    name: missing root expected case count
    find: "expectedCaseCount: 3\n"
    replace: "# expected case count removed\n"
    expectedError: missing=expectedCaseCount
  - category: required
    path: root.cases
    name: missing root cases
    find: "cases:\n  - name: mounted_transcript_and_checkbox\n"
    replace: "removedCases:\n  - name: mounted_transcript_and_checkbox\n"
    expectedError: missing=cases
  - category: required
    path: case.name
    name: missing case name
    find: "  - name: mounted_transcript_and_checkbox\n"
    replace: "  - removedName: mounted_transcript_and_checkbox\n"
    expectedError: missing=name
  - category: required
    path: case.session
    name: missing case session
    find: "    session:\n      id: session-accessibility\n"
    replace: "    removedSession:\n      id: session-accessibility\n"
    expectedError: missing=session
  - category: required
    path: case.checkbox
    name: missing case checkbox
    find: "    checkbox:\n      label: tool calls\n"
    replace: "    removedCheckbox:\n      label: tool calls\n"
    expectedError: missing=checkbox
  - category: required
    path: case.expected
    name: missing case expected result
    find: "      count: 7\n      initialChecked: false\n      expectedAfterClick: true\n    expected:\n      mainLandmarks: 0\n"
    replace: "      count: 7\n      initialChecked: false\n      expectedAfterClick: true\n    removedExpected:\n      mainLandmarks: 0\n"
    expectedError: missing=expected
  - category: required
    path: session.id
    name: missing session id
    find: "      id: session-accessibility\n"
    replace: ""
    expectedError: missing=id
  - category: required
    path: session.harness
    name: missing session harness
    find: "      harness: codex\n"
    replace: ""
    expectedError: missing=harness
  - category: required
    path: session.startTime
    name: missing session start time
    find: "      startTime: 2026-07-15T08:00:00Z\n"
    replace: ""
    expectedError: missing=startTime
  - category: required
    path: session.endTime
    name: missing session end time
    find: "      endTime: 2026-07-15T08:01:00Z\n"
    replace: ""
    expectedError: missing=endTime
  - category: required
    path: session.durationMins
