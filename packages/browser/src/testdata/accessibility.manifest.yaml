  - category: required
    path: turn.timestamp
    name: missing turn timestamp
    find: "          timestamp: 2026-07-15T08:00:00Z\n"
    replace: ""
    expectedError: missing=timestamp
  - category: required
    path: turn.depth
    name: missing turn depth
    find: "          depth: 0\n          stopReason: max_turn_requests\n"
