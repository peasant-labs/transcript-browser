  - category: required
    path: checkbox.count
    name: missing checkbox count
    find: "      count: 7\n"
    replace: ""
    expectedError: missing=count
  - category: required
    path: checkbox.initialChecked
    name: missing checkbox initial state
    find: "      count: 7\n      initialChecked: false\n      expectedAfterClick: true\n"
    replace: "      count: 7\n      expectedAfterClick: true\n"
    expectedError: missing=initialChecked
  - category: required
    path: checkbox.expectedAfterClick
    name: missing checkbox click result
    find: "      count: 7\n      initialChecked: false\n      expectedAfterClick: true\n"
    replace: "      count: 7\n      initialChecked: false\n"
