titles:
  valid:
    - {name: final, input: "release(v1.2.3): final release", version: "1.2.3", tag: "transcript-browser-v1.2.3"}
    - {name: candidate, input: "release(v1.2.3-rc4): release candidate", version: "1.2.3-rc4", tag: "transcript-browser-v1.2.3-rc4"}
    - {name: zero core, input: "release(v0.0.0): zero core", version: "0.0.0", tag: "transcript-browser-v0.0.0"}
  invalid:
    - {name: missing v, input: "release(1.2.3): missing v"}
    - {name: short core, input: "release(v1.2): short version"}
    - {name: empty subject, input: "release(v1.2.3):"}
    - {name: extra separator, input: "release(v1.2.3):  double separator"}
    - {name: prefix, input: "prefix release(v1.2.3): subject"}
    - {name: beta, input: "release(v1.2.3-beta1): unsupported prerelease"}
    - {name: leading zero major, input: "release(v01.2.3): bad major"}
    - {name: leading zero minor, input: "release(v1.02.3): bad minor"}
    - {name: leading zero patch, input: "release(v1.2.03): bad patch"}
    - {name: rc zero, input: "release(v1.2.3-rc0): bad rc"}
    - {name: rc padded, input: "release(v1.2.3-rc01): bad rc"}
tags:
  valid:
    - {name: final, input: "transcript-browser-v1.2.3"}
    - {name: candidate, input: "transcript-browser-v1.2.3-rc4"}
    - {name: zero core, input: "transcript-browser-v0.0.0"}
  invalid:
    - {name: missing namespace, input: "v1.2.3"}
    - {name: missing v, input: "transcript-browser-1.2.3"}
    - {name: beta, input: "transcript-browser-v1.2.3-beta1"}
    - {name: leading zero major, input: "transcript-browser-v01.2.3"}
    - {name: leading zero minor, input: "transcript-browser-v1.02.3"}
    - {name: leading zero patch, input: "transcript-browser-v1.2.03"}
    - {name: rc zero, input: "transcript-browser-v1.2.3-rc0"}
    - {name: rc padded, input: "transcript-browser-v1.2.3-rc01"}
permissions: {allowed: [admin, maintain], denied: [write, triage, read, none]}
reviews:
  - {name: latest approval wins, maintainers: [alice], reviews: [{user: alice, state: CHANGES_REQUESTED}, {user: alice, state: APPROVED}], approved: true}
  - {name: approval revoked, maintainers: [alice], reviews: [{user: alice, state: APPROVED}, {user: alice, state: CHANGES_REQUESTED}], approved: false}
  - {name: non-maintainer ignored, maintainers: [alice], reviews: [{user: bob, state: APPROVED}], approved: false}
metadata:
  valid: {number: 17, state: closed, merged: true, title: "release(v0.0.6): automate release tags", user: {login: alice}, base: {ref: main}, merge_commit_sha: abc123}
  invalid:
    - {name: unmerged, patch: {merged: false}}
    - {name: wrong base, patch: {base: {ref: develop}}}
    - {name: empty SHA, patch: {merge_commit_sha: ""}}
    - {name: malformed payload, payload: []}
github:
  resolve:
    responses:
      - {body: {number: 17, state: closed, merged: true, title: "release(v0.0.6): automate release tags", user: {login: alice}, base: {ref: main}, merge_commit_sha: abc123}}
      - {body: {permission: admin}}
    expected_merge_sha: abc123
  pagination:
    - name: page two revokes approval
      responses:
        - {body: [{user: {login: alice}, state: APPROVED}], link: '<https://api.github.com/repos/peasant-labs/transcript-browser/pulls/17/reviews?per_page=100&page=2>; rel="next"'}
        - {body: [{user: {login: alice}, state: CHANGES_REQUESTED}]}
        - {body: {permission: maintain}}
      approved: false
    - name: page two grants approval
      responses:
        - {body: [{user: {login: alice}, state: CHANGES_REQUESTED}], link: '<https://api.github.com/repos/peasant-labs/transcript-browser/pulls/17/reviews?per_page=100&page=2>; rel="next"'}
        - {body: [{user: {login: alice}, state: APPROVED}]}
        - {body: {permission: maintain}}
      approved: true
workflow:
  validate_if: "github.event_name == 'pull_request' && github.event.action != 'closed' && startsWith(github.event.pull_request.title, 'release(')"
  tag_if: "github.event_name == 'workflow_dispatch' || (github.event.action == 'closed' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'release('))"
  release_needles: [PEASANT_RELEASER_APP_ID, PEASANT_RELEASER_APP_PRIVATE_KEY, "actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1", "owner: peasant-labs", "repositories: transcript-browser", 'ref: ${{ steps.release.outputs.mergeSha }}', 'git merge-base --is-ancestor "$MERGE_SHA" origin/main', "check-package packages/browser/package.json", 'git tag -a "$TAG" "$MERGE_SHA" -m "$PR_TITLE"', "git rev-parse -q --verify", "git ls-remote --exit-code --tags", 'git push --atomic origin "refs/tags/$TAG"']
  publish_needles: ['node scripts/release-guard.mjs parse-tag "$TAG"', "working-directory: packages/browser", "npm publish --access public", "id-token: write", "pnpm check"]
  mutations:
    - {name: unconditional tag, target: tag_if, replacement: "true || github.event_name == 'workflow_dispatch'"}
    - {name: missing merged restriction, target: tag_if, replacement: "github.event_name == 'workflow_dispatch' || github.event.action == 'closed'"}
    - {name: weakened validation, target: validate_if, replacement: "true || github.event_name == 'pull_request'"}
git: {tag: transcript-browser-v1.2.3, first_message: first release, second_message: attempted replacement}
